{% extends "base.html" %}

{% block title %}Household Tracker{% endblock %}

{% block content %}
<main class="dashboard">
    <header class="dashboard__header">
        <h1 class="dashboard__title">Household Inventory</h1>
        <button class="btn btn--primary" type="button"
                hx-get="/items/new"
                hx-target="body"
                hx-swap="beforeend">
            <svg class="btn__glyph" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Add item
        </button>
    </header>
    {% include "partials/dashboard_body.html" %}
    {% include "partials/notification_modal.html" %}
</main>
{% endblock %}
